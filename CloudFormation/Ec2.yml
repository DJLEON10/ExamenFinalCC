AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 Estatica con Elastic IP - Stack 2

Resources:
  EC2Daniel-Leon:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c02fb55956c7d316  # Amazon Linux 2 us-east-1
      InstanceType: t2.micro
      SecurityGroupIds:
        - !ImportValue SGec2Id-Daniel-Leon
      Tags:
        - Key: Name
          Value: ec2-Daniel-Leon
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hola desde EC2 - Daniel Leon</h1>" > /var/www/html/index.html

  EIPDaniel-Leon:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref EC2Daniel-Leon
      Tags:
        - Key: Name
          Value: eip-Daniel-Leon

Outputs:
  EC2PublicIP:
    Value: !Ref EIPDaniel-Leon
    Export:
      Name: EC2EIP-Daniel-Leon

  EC2InstanceId:
    Value: !Ref EC2Daniel-Leon
    Export:
      Name: EC2Id-Daniel-Leon
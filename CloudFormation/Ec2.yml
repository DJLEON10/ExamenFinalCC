AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 con Elastic IP

Parameters:

  SecurityGroupId:
    Type: String

Resources:

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-05ffe3c48a9991133
      InstanceType: t3.micro

      SecurityGroupIds:
        - !Ref SecurityGroupId

      Tags:
        - Key: Name
          Value: EC2-Joseph-Jamid

      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd

          echo "<h1>Examen Final Cloud Computing</h1>" > /var/www/html/index.html

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  ElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      InstanceId: !Ref EC2Instance

Outputs:

  InstanceId:
    Value: !Ref EC2Instance

  PublicIP:
    Value: !Ref ElasticIP
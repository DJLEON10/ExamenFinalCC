AWSTemplateFormatVersion: "2010-09-09"
Description: Scheduled Actions + Launch Template v2 - Stack 4

Resources:
  LTV2Daniel-Leon:
    Type: AWS::EC2::LaunchTemplateVersion
    Properties:
      LaunchTemplateId: !ImportValue LTId-Daniel-Leon
      LaunchTemplateData:
        ImageId: ami-0c02fb55956c7d316
        InstanceType: t2.micro
        SecurityGroupIds:
          - !ImportValue SGec2Id-Daniel-Leon
        UserData:
          Fn::Base64: |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd
            echo "<h1>Instancia ASG v2 - Daniel Leon</h1>" > /var/www/html/index.html

  ScaleUpMorning:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue ASGName-Daniel-Leon
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 3
      Recurrence: "0 8 * * MON-FRI"

  ScaleUpAfternoon:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue ASGName-Daniel-Leon
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 4
      Recurrence: "0 14 * * MON-FRI"

  ScaleDownEvening:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue ASGName-Daniel-Leon
      MinSize: 1
      MaxSize: 3
      DesiredCapacity: 2
      Recurrence: "0 20 * * MON-FRI"

  ScaleDownNight:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !ImportValue ASGName-Daniel-Leon
      MinSize: 1
      MaxSize: 2
      DesiredCapacity: 1
      Recurrence: "0 23 * * *"

Outputs:
  LTVersion2:
    Value: !Ref LTV2Daniel-Leon
    Export:
      Name: LTv2-Daniel-Leon
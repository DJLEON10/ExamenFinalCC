AWSTemplateFormatVersion: "2010-09-09"
Description: ALB + ASG + Warm Pool - Stack 3

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-06060a3f77407e9b2  # <- reemplaza con tu VPC default
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: "subnet-0099321b7f6f65f3d,subnet-0eae0f2aa3fd28989"  # <- subredes de la VPC default

Resources:
  TargetGroupDaniel-Leon:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-Daniel-Leon
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VpcId
      HealthCheckPath: /
      TargetType: instance
      Tags:
        - Key: Name
          Value: tg-Daniel-Leon

  ALBDaniel-Leon:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: alb-Daniel-Leon
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !ImportValue SGalbId-Daniel-Leon
      Scheme: internet-facing
      Tags:
        - Key: Name
          Value: alb-Daniel-Leon

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALBDaniel-Leon
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupDaniel-Leon

  LaunchTemplateDaniel-Leon:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: lt-Daniel-Leon
      LaunchTemplateData:
        ImageId: ami-0c02fb55956c7d316
        InstanceType: t2.micro
        SecurityGroupIds:
          - !ImportValue SGec2Id-Daniel-Leon
        UserData:
          Fn::Base64: |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd
            echo "<h1>Instancia ASG v1 - Daniel Leon</h1>" > /var/www/html/index.html

  ASGDaniel-Leon:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: asg-Daniel-Leon
      MinSize: "1"
      MaxSize: "3"
      DesiredCapacity: "2"
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplateDaniel-Leon
        Version: !GetAtt LaunchTemplateDaniel-Leon.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroupDaniel-Leon
      Tags:
        - Key: Name
          Value: instancia-asg-Daniel-Leon
          PropagateAtLaunch: true

  WarmPoolDaniel-Leon:
    Type: AWS::AutoScaling::WarmPool
    Properties:
      AutoScalingGroupName: !Ref ASGDaniel-Leon
      MinSize: 1
      PoolState: Stopped

Outputs:
  ALBDns:
    Value: !GetAtt ALBDaniel-Leon.DNSName
    Export:
      Name: ALBDns-Daniel-Leon

  LaunchTemplateId:
    Value: !Ref LaunchTemplateDaniel-Leon
    Export:
      Name: LTId-Daniel-Leon

  ASGName:
    Value: !Ref ASGDaniel-Leon
    Export:
      Name: ASGName-Daniel-Leon
name: Destroy Infrastructure

on:
  workflow_dispatch:

jobs:
  Destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Destroy Stack Automation
        run: aws cloudformation delete-stack --stack-name Automation-Daniel-Leon && aws cloudformation wait stack-delete-complete --stack-name Automation-Daniel-Leon

      - name: Destroy Stack ALB-ASG
        run: aws cloudformation delete-stack --stack-name ALB-ASG-Daniel-Leon && aws cloudformation wait stack-delete-complete --stack-name ALB-ASG-Daniel-Leon

      - name: Destroy Stack EC2
        run: aws cloudformation delete-stack --stack-name EC2-Daniel-Leon && aws cloudformation wait stack-delete-complete --stack-name EC2-Daniel-Leon

      - name: Destroy Stack Security
        run: aws cloudformation delete-stack --stack-name SecurityGroups-Daniel-Leon && aws cloudformation wait stack-delete-complete --stack-name SecurityGroups-Daniel-Leon